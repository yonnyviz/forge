:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;color-scheme:light}*{box-sizing:border-box}body{--bg:#f6f7fb;--surface:#fff;--muted-surface:#f0f1f6;--border:#e3e5ed;--text:#24252d;--muted:#6c7180;--accent:#635bdb;--accent-soft:#eeedff;--success:#16794d;--warning:#a35b00;margin:0;min-height:100vh;background:var(--bg);color:var(--text);transition:background .2s,color .2s}body[data-theme=dark]{color-scheme:dark;--bg:#17181d;--surface:#202229;--muted-surface:#2b2d36;--border:#383b47;--text:#f4f4f6;--muted:#a8abb8;--accent:#aaa3ff;--accent-soft:#353352;--success:#7ee2b1;--warning:#ffc26d}@media(prefers-color-scheme:dark){body:not([data-theme=light]){color-scheme:dark;--bg:#17181d;--surface:#202229;--muted-surface:#2b2d36;--border:#383b47;--text:#f4f4f6;--muted:#a8abb8;--accent:#aaa3ff;--accent-soft:#353352;--success:#7ee2b1;--warning:#ffc26d}}a{color:inherit}.shell{max-width:1320px;margin:auto;padding:27px 29px 65px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.02em;text-decoration:none}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff}.top-actions{display:flex;align-items:center;gap:15px}.local{font-size:13px;color:var(--muted)}.local strong{color:var(--success);font-size:17px}.theme{border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);padding:9px 12px;cursor:pointer;font:inherit;font-size:13px}.theme:hover,.back:hover,.source-link:hover,.file-link:hover{border-color:var(--accent);color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:43px}.sidebar{border-right:1px solid var(--border);padding-right:25px}.eyebrow,.side-label{color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.side-label{margin:9px 0 13px}.side-nav{display:grid;gap:4px}.side-link,.file-link{display:block;border-radius:8px;padding:9px 10px;color:var(--muted);font-size:14px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-link:hover,.side-link.selected,.file-link:hover,.file-link.selected{background:var(--accent-soft);color:var(--accent);font-weight:650}.side-note{border-top:1px solid var(--border);margin-top:27px;padding-top:17px;color:var(--muted);font-size:12px}.content{min-width:0}.heading{margin-bottom:27px}.heading h1{font-size:clamp(31px,4vw,47px);line-height:1.08;letter-spacing:-.045em;margin:5px 0 10px}.lede{max-width:680px;color:var(--muted);margin:0}.count{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:17px}.card,.panel,.empty,.error,.loading{border:1px solid var(--border);border-radius:14px;background:var(--surface)}.card{display:flex;min-height:275px;flex-direction:column;padding:21px;text-decoration:none;transition:transform .15s,border-color .15s,box-shadow .15s}.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 12px 30px rgba(31,35,50,.1)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700;text-transform:capitalize}.status:before{content:"";width:8px;height:8px;border:2px solid currentColor;border-radius:50%}.status.active,.status.completed,.status.healthy{color:var(--success)}.status.active:before,.status.completed:before,.status.healthy:before{background:currentColor}.status.blocked,.status.needs-attention{color:var(--warning)}.status.blocked:before,.status.needs-attention:before{border-radius:2px}.phase,.updated{color:var(--muted);font-size:12px}.card h2{font-size:20px;line-height:1.2;letter-spacing:-.025em;margin:20px 0 8px}.card-summary{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:14px;margin:0}.card-bottom{margin-top:auto;padding-top:21px}.progress-label,.progress-copy{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:10px}.progress-value{font-weight:750;color:var(--text)}.track{height:9px;margin-top:8px;border-radius:99px;background:var(--muted-surface);overflow:hidden}.fill{height:100%;border-radius:inherit;background:var(--accent)}.next{border-top:1px solid var(--border);margin-top:17px;padding-top:13px;font-size:13px}.next small{display:block;margin-bottom:4px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.next strong{font-weight:600}.empty,.error,.loading{padding:38px 27px}.empty h2,.error h2{font-size:20px;margin:0 0 7px}.empty p,.error p{color:var(--muted);margin:0}.retry{margin-top:17px;border:0;border-radius:8px;padding:10px 14px;background:var(--accent);color:#fff;font:inherit;font-weight:650;cursor:pointer}.skeleton{width:80%;height:12px;margin:12px 0;border-radius:5px;background:var(--muted-surface)}.skeleton.short{width:42%}.back{display:inline-block;border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--muted);font-size:13px;text-decoration:none;margin-bottom:23px}.detail-title{margin-bottom:27px}.detail-title h1{font-size:clamp(31px,4vw,47px);line-height:1.08;letter-spacing:-.045em;margin:5px 0 12px}.detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:13px}.detail-meta .phase,.detail-meta .updated{border-left:1px solid var(--border);padding-left:13px}.detail-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:17px}.panel{padding:21px}.panel h2{font-size:15px;margin:0 0 14px}.panel p{color:var(--muted);margin:0}.objective{min-height:150px}.objective p{font-size:17px;line-height:1.6;color:var(--text)}.span-two{grid-row:span 2}.next-panel{background:var(--accent-soft);border-color:transparent}.next-panel p{font-size:16px;color:var(--text)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}.fact-label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}.fact-value{display:block;margin-top:3px;font-size:14px;font-weight:600;overflow-wrap:anywhere}.missing{margin-top:17px;border-radius:8px;padding:10px 12px;background:var(--muted-surface);color:var(--muted);font-size:12px}.source-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:7px;padding:5px 8px;color:var(--muted);font-size:12px;text-decoration:none}.source-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.item-list{display:grid;gap:11px;margin:0;padding:0;list-style:none}.item-list li{border-bottom:1px solid var(--border);padding-bottom:10px}.item-list li:last-child{border-bottom:0;padding-bottom:0}.item-title{font-weight:650}.item-meta{display:block;margin-top:2px;color:var(--muted);font-size:12px}.activity-list{display:grid;gap:14px;margin:0;padding:0;list-style:none}.activity-list li{padding-left:15px;border-left:2px solid var(--accent)}.activity-list strong{display:block;font-size:13px}.activity-list p{font-size:13px;margin-top:2px}.content-layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:start}.file-nav{position:sticky;top:18px}.file-group{margin-bottom:19px}.file-group h3{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 10px 6px}.file-link{font-size:13px;padding:7px 10px}.reader{min-width:0}.reader-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:17px}.reader-header h2{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}.reader-body{font-size:15px;line-height:1.7}.reader-body h1,.reader-body h2,.reader-body h3{line-height:1.2;letter-spacing:-.025em;margin:1.7em 0 .55em}.reader-body h1{font-size:30px}.reader-body h2{font-size:23px}.reader-body h3{font-size:18px}.reader-body h1:first-child,.reader-body h2:first-child{margin-top:0}.reader-body p{color:var(--text);margin:0 0 1em}.reader-body ul,.reader-body ol{padding-left:25px;margin:0 0 1em}.reader-body li{margin:3px 0}.reader-body blockquote{border-left:3px solid var(--accent);margin:1em 0;padding:2px 17px;color:var(--muted)}.reader-body pre{overflow:auto;border-radius:9px;padding:15px;background:var(--muted-surface);font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.reader-body code{border-radius:4px;padding:2px 5px;background:var(--muted-surface);font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.reader-body pre code{padding:0;background:transparent}.reader-body hr{border:0;border-top:1px solid var(--border);margin:1.7em 0}.reader-body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.reader-body table{display:block;max-width:100%;overflow:auto;border-collapse:collapse;margin:1em 0}.reader-body th,.reader-body td{border:1px solid var(--border);padding:7px 10px;text-align:left}.reader-body th{background:var(--muted-surface)}
.skip{position:absolute;left:12px;top:-50px;z-index:5;border-radius:7px;padding:8px 11px;background:var(--accent);color:#fff}.skip:focus{top:12px}.refresh-status{color:var(--muted);font-size:12px}.refresh-status[data-state=error]{color:var(--warning)}.refresh{border:0;background:transparent;color:var(--muted);padding:5px;cursor:pointer;font:inherit;font-size:12px}.refresh:hover{color:var(--accent)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media(max-width:820px){.shell{padding:20px 17px 45px}.layout{display:block}.sidebar{border:0;border-bottom:1px solid var(--border);padding:0 0 17px;margin-bottom:27px}.side-nav{display:flex;overflow:auto}.side-link{flex:0 0 auto}.side-note{display:none}.detail-grid{grid-template-columns:1fr}.span-two{grid-row:auto}.content-layout{grid-template-columns:1fr}.file-nav{position:static;display:flex;gap:10px;overflow:auto;border-bottom:1px solid var(--border);padding-bottom:10px}.file-group{display:flex;align-items:center;gap:3px;margin:0;flex:0 0 auto}.file-group h3{margin:0 5px;font-size:10px}.file-link{flex:0 0 auto}}@media(max-width:480px){.topbar{margin-bottom:26px}.local{display:none}.cards{grid-template-columns:1fr}.card{min-height:250px}.panel{padding:18px}.reader-body h1{font-size:27px}}

<body><a class="skip" href="#app">Skip to content</a><div class="shell"><header class="topbar"><a class="brand" href="#" aria-label="Forge dashboard home"><span class="brand-mark" aria-hidden="true">🔨</span><span>Forge</span></a><div class="top-actions"><span class="local"><strong aria-hidden="true">●</strong> Local only</span><span class="refresh-status" id="refresh-status" role="status">Refreshing…</span><button class="refresh" id="refresh" type="button">↻ Refresh</button><button class="theme" id="theme" type="button">🌙 Dark</button></div></header><div class="layout"><aside class="sidebar"><div class="side-label">Initiatives</div><nav class="side-nav" id="nav" aria-label="Initiatives"></nav><p class="side-note">Source files remain the source of truth. Refresh to see changes.</p></aside><main class="content" id="app" tabindex="-1" aria-live="polite" aria-busy="true"><div class="loading"><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div></div></main></div></div>
<script>
const app=document.querySelector('#app'),nav=document.querySelector('#nav'),themeButton=document.querySelector('#theme'),refreshButton=document.querySelector('#refresh'),refreshStatus=document.querySelector('#refresh-status');let initiatives=[],dataFingerprint='',refreshing=false;
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cls(value){return String(value||'unknown').toLowerCase().replace(/[^a-z-]/g,'-')}
function date(value){if(!value)return 'Not available';const d=new Date(value);return Number.isNaN(d.getTime())?'Not available':new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(d)}
function hash(){return new URLSearchParams(location.hash.slice(1))}
function id(){return hash().get('initiative')||''}
function file(){return hash().get('file')||''}
function route(item,path){return '#initiative='+encodeURIComponent(item.id)+(path?'&file='+encodeURIComponent(path):'')}
function setTheme(value){if(value==='system'){delete document.body.dataset.theme}else document.body.dataset.theme=value;localStorage.setItem('forge-theme',value);themeButton.textContent=value==='dark'?'☀️ Light':'🌙 Dark';themeButton.setAttribute('aria-label',value==='dark'?'Use light theme':'Use dark theme')}
function setRefreshStatus(label,state){refreshStatus.textContent=label;refreshStatus.dataset.state=state||'ok'}
const saved=localStorage.getItem('forge-theme');setTheme(saved==='dark'||saved==='light'?saved:'system');themeButton.addEventListener('click',()=>setTheme(document.body.dataset.theme==='dark'?'light':'dark'));
function progress(item,detail){const value=Number(item.progress);const known=Number.isFinite(value);const amount=known?Math.max(0,Math.min(100,value)):0;return '<div class="progress-label"><span>Progress</span><strong class="progress-value">'+(known?amount+'%':'Not set')+'</strong></div><div class="track" role="progressbar" aria-label="'+esc(item.title)+' progress" aria-valuemin="0" aria-valuemax="100"'+(known?' aria-valuenow="'+amount+'"':'')+'><div class="fill" style="width:'+amount+'%"></div></div>'+(detail?'<div class="progress-copy"><span>'+(known?'Current completion':'Progress has not been recorded')+'</span><span>'+(known?'of 100%':'')+'</span></div>':'')}
function source(item,path,label){return item.files&&item.files.includes(path)?'<a class="source-link" href="'+route(item,path)+'">↗ '+esc(label||path)+'</a>':''}
function navMarkup(selected){nav.innerHTML=initiatives.length?initiatives.map(item=>'<a class="side-link '+(item.id===selected?'selected':'')+'" href="'+route(item)+'"'+(item.id===selected?' aria-current="page"':'')+'>'+esc(item.title)+'</a>').join(''):'<span class="side-note">No initiatives found.</span>'}
function missing(item){return item.missing_fields&&item.missing_fields.length?'<div class="missing">Missing data: '+item.missing_fields.map(esc).join(', ')+'. Add it to the initiative files when useful.</div>':''}
function card(item){const health=item.health||'unknown';return '<a class="card" href="'+route(item)+'"><div class="row"><span class="status '+cls(item.status)+'">'+esc(item.status||'Unknown')+'</span><span class="phase">'+esc(item.phase||'Phase not set')+'</span></div><h2>'+esc(item.title)+'</h2><p class="card-summary">'+esc(item.description||'No summary has been recorded.')+'</p><div class="card-bottom">'+progress(item,false)+'<div class="progress-copy"><span>Updated '+esc(date(item.updated))+'</span><span class="status '+cls(health)+'">'+(health==='healthy'?'Healthy':'Needs attention')+'</span></div><div class="next"><small>Next action</small><strong>'+esc(item.next_action||'Not specified')+'</strong></div></div></a>'}
function indexView(){return '<div class="heading"><div class="eyebrow">Overview</div><h1>Initiatives</h1><p class="lede">A calm view of what is happening, what changed, and what needs attention.</p><div class="count">'+initiatives.length+' initiative'+(initiatives.length===1?'':'s')+'</div></div>'+(initiatives.length?'<section class="cards" aria-label="Initiative summaries">'+initiatives.map(card).join('')+'</section>':'<section class="empty"><h2>No initiatives found</h2><p>Check that your configured initiative roots contain readable initiative folders.</p></section>')}
function itemList(items,empty){return items&&items.length?'<ul class="item-list">'+items.map(item=>'<li><span class="item-title">'+esc(item.id?item.id+' · ':'')+esc(item.title)+'</span><span class="item-meta">'+esc(item.status||item.date||'Not stated')+(item.date?' · '+esc(item.date):'')+'</span></li>').join('')+'</ul>':'<p>'+empty+'</p>'}
function activity(item){return item.activity&&item.activity.length?'<ul class="activity-list">'+item.activity.map(entry=>'<li><strong>'+esc(entry.date||'Undated')+' · '+esc(entry.title)+'</strong><p>'+esc(entry.summary)+'</p>'+source(item,entry.source,'Read session notes')+'</li>').join('')+'</ul>':'<p>No recorded activity yet.</p>'}
function overview(item){return '<section class="detail-grid"><article class="panel objective"><h2>Objective</h2><p>'+esc(item.objective||item.goal||'No objective has been recorded yet.')+'</p>'+missing(item)+'<div class="source-row">'+source(item,'README.md','Read README')+'</div></article><article class="panel span-two"><h2>Recent activity</h2>'+activity(item)+'</article><article class="panel"><h2>Progress</h2>'+progress(item,true)+'<div class="source-row">'+source(item,'planning/ROADMAP.md','Open roadmap')+'</div></article><article class="panel next-panel"><h2>Next action</h2><p>'+esc(item.next_action||'No next action has been specified.')+'</p><div class="source-row">'+source(item,'README.md','Open source')+'</div></article><article class="panel"><h2>Milestones</h2>'+itemList(item.milestones,'No milestones found in the roadmap.')+'<div class="source-row">'+source(item,'planning/ROADMAP.md','Open roadmap')+'</div></article><article class="panel"><h2>Decisions</h2>'+itemList(item.decisions,'No decisions recorded yet.')+'<div class="source-row">'+source(item,'docs/DECISIONS.md','Open decisions')+'</div></article><article class="panel"><h2>At a glance</h2><div class="facts"><div><span class="fact-label">Health</span><span class="fact-value status '+cls(item.health)+'">'+(item.health==='healthy'?'Healthy':'Needs attention')+'</span></div><div><span class="fact-label">Owner</span><span class="fact-value">'+esc(item.owner||'Not assigned')+'</span></div><div><span class="fact-label">Phase</span><span class="fact-value">'+esc(item.phase||'Not set')+'</span></div><div><span class="fact-label">Updated</span><span class="fact-value">'+esc(date(item.updated))+'</span></div></div></article></section>'}
function groups(files){const result={Core:[],Planning:[],Docs:[],Research:[],Outputs:[],Sessions:[],Other:[]};(files||[]).forEach(path=>{const key=path==='README.md'?'Core':path.startsWith('planning/')?'Planning':path.startsWith('docs/')?'Docs':path.startsWith('research/')?'Research':path.startsWith('outputs/')?'Outputs':path.startsWith('sessions/')?'Sessions':'Other';result[key].push(path)});return result}
function fileNav(item,current){const grouped=groups(item.files);return '<nav class="file-nav" aria-label="Initiative files">'+Object.entries(grouped).filter(([,files])=>files.length).map(([name,files])=>'<div class="file-group"><h3>'+name+'</h3>'+files.map(path=>'<a class="file-link '+(path===current?'selected':'')+'" href="'+route(item,path)+'">'+esc(path.split('/').pop())+'</a>').join('')).join('')+'</nav>'}
function safeHref(item,current,url){if(/^https?:\/\//i.test(url)||/^mailto:/i.test(url)||url.startsWith('#'))return url;if(!/\.(md|json)$/i.test(url.split('#')[0]))return '';const base=current.split('/');base.pop();const parts=(base.concat(url.split('#')[0].split('/')));const result=[];for(const part of parts){if(!part||part==='.')continue;if(part==='..'){if(!result.length)return '';result.pop()}else{if(part.startsWith('.'))return '';result.push(part)}}const path=result.join('/');return item.files.includes(path)?route(item,path):''}
function inline(item,current,text){let value=esc(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');return value.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,(all,label,url)=>{const href=safeHref(item,current,url);return href?'<a href="'+esc(href)+'">'+label+'</a>':label})}
function markdown(item,current,markdownText){const lines=markdownText.replace(/\r\n?/g,'\n').split('\n'),out=[];let code=false,codeLines=[];let list='';const closeList=()=>{if(list){out.push('</'+list+'>');list=''}};for(const line of lines){if(line.startsWith('```')){if(code){out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');codeLines=[];code=false}else{closeList();code=true}continue}if(code){codeLines.push(line);continue}if(!line.trim()){closeList();continue}let match;if((match=line.match(/^(#{1,3})\s+(.+)$/))){closeList();const level=match[1].length;out.push('<h'+level+'>'+inline(item,current,match[2])+'</h'+level+'>');continue}if(/^---+$/.test(line.trim())){closeList();out.push('<hr>');continue}if((match=line.match(/^>\s?(.*)$/))){closeList();out.push('<blockquote>'+inline(item,current,match[1])+'</blockquote>');continue}if((match=line.match(/^\s*[-*+]\s+(.+)$/))){if(list!=='ul'){closeList();out.push('<ul>');list='ul'}out.push('<li>'+inline(item,current,match[1])+'</li>');continue}if((match=line.match(/^\s*\d+\.\s+(.+)$/))){if(list!=='ol'){closeList();out.push('<ol>');list='ol'}out.push('<li>'+inline(item,current,match[1])+'</li>');continue}closeList();if((match=line.match(/^\|(.+)\|$/))){const cells=match[1].split('|').map(cell=>'<td>'+inline(item,current,cell.trim())+'</td>').join('');out.push('<table><tr>'+cells+'</tr></table>');continue}out.push('<p>'+inline(item,current,line)+'</p>')}closeList();if(code)out.push('<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>');return out.join('')}
async function reader(item,path){if(!path)return '<section class="empty"><h2>Choose a document</h2><p>Select a file from the content navigation.</p></section>';if(!item.files.includes(path))return '<section class="error"><h2>File unavailable</h2><p>This file is not in the approved initiative inventory.</p></section>';try{const response=await fetch('/api/initiatives/'+encodeURIComponent(item.id)+'/files?path='+encodeURIComponent(path));if(!response.ok)throw new Error('The file could not be read.');const value=await response.json();return '<article class="panel reader"><div class="reader-header"><h2>'+esc(path)+'</h2><a class="source-link" href="'+route(item)+'">← Overview</a></div><div class="reader-body">'+markdown(item,path,value.content)+'</div></article>'}catch(error){return '<section class="error"><h2>Could not read document</h2><p>'+esc(error.message)+'</p></section>'}}
async function detailView(item){const path=file();const body=path?await reader(item,path):overview(item);return '<div class="detail-title"><a class="back" href="#">← All initiatives</a><div class="eyebrow">Initiative detail</div><h1>'+esc(item.title)+'</h1><div class="detail-meta"><span class="status '+cls(item.status)+'">'+esc(item.status||'Unknown')+'</span><span class="phase">'+esc(item.phase||'Phase not set')+'</span><span class="updated">Updated '+esc(date(item.updated))+'</span></div></div>'+(path?'<div class="content-layout">'+fileNav(item,path)+body+'</div>':overview(item)+'<div class="source-row" style="margin-top:18px"><a class="source-link" href="'+route(item,'README.md')+'">Browse initiative content →</a></div>')}
function render(){const selected=id();const item=initiatives.find(candidate=>candidate.id===selected);navMarkup(selected);if(!item){app.innerHTML=indexView();return}app.innerHTML='<div class="loading"><div class="skeleton short"></div><div class="skeleton"></div></div>';detailView(item).then(html=>{if(id()===item.id)app.innerHTML=html})}
function errorView(message){app.innerHTML='<section class="error"><h2>Could not load initiatives</h2><p>'+esc(message)+'</p><button class="retry" id="retry" type="button">Try again</button></section>';app.setAttribute('aria-busy','false');document.querySelector('#retry').addEventListener('click',load)}
async function refreshReader(item,path){try{const response=await fetch('/api/initiatives/'+encodeURIComponent(item.id)+'/files?path='+encodeURIComponent(path));if(!response.ok){const detail=await response.json().catch(()=>({}));throw new Error(detail.error||'The file could not be read.')}const value=await response.json();const body=document.querySelector('.reader-body');if(body)body.innerHTML=markdown(item,path,value.content)}catch(error){setRefreshStatus('Refresh failed','error')}}
async function refreshData(silent){if(refreshing)return;refreshing=true;if(!silent){setRefreshStatus('Refreshing…','ok');app.setAttribute('aria-busy','true');app.innerHTML='<div class="loading"><div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div></div>'}try{const response=await fetch('/api/initiatives');if(!response.ok){const detail=await response.json().catch(()=>({}));throw new Error(detail.error||'The dashboard server returned '+response.status+'.')}const next=await response.json();const nextFingerprint=JSON.stringify(next);const changed=nextFingerprint!==dataFingerprint;initiatives=next;dataFingerprint=nextFingerprint;if(changed||!silent)render();else{const item=initiatives.find(candidate=>candidate.id===id());const path=file();if(item&&path)await refreshReader(item,path)}setRefreshStatus('Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),'ok')}catch(error){setRefreshStatus('Refresh failed','error');if(!silent)errorView(error.message||'Unknown error')}finally{refreshing=false;app.setAttribute('aria-busy','false')}}
function load(){return refreshData(false)}
refreshButton.addEventListener('click',()=>refreshData(false));window.addEventListener('hashchange',render);setInterval(()=>{if(!document.hidden)refreshData(true)},5000);load();
</script></body></html>
